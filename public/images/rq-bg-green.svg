<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 200" width="1024" height="200">
  <!-- 실화냐 2탄 배경 맨 아래: 초록 오름 능선, 눈 덮인 한라산, 왼쪽 유채꽃, 오른쪽 현무암 돌담 (사용자가 준 시안처럼, 2026-11-03. 웹진에서 직접 그린 그림) -->
  <defs>
    <linearGradient id="far" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C4D2B4"/><stop offset="1" stop-color="#AEC19C"/></linearGradient>
    <linearGradient id="halla" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9DB39A"/><stop offset="1" stop-color="#86A084"/></linearGradient>
    <linearGradient id="near" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#93AE7D"/><stop offset="1" stop-color="#7B9866"/></linearGradient>
    <radialGradient id="rock" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#5E5B57"/><stop offset="1" stop-color="#3B3936"/></radialGradient>
    <symbol id="fl" viewBox="-12 -12 24 24">
      <g fill="#FFD23F"><ellipse cx="0" cy="-6" rx="4.6" ry="6"/><ellipse cx="6" cy="0" rx="6" ry="4.6"/><ellipse cx="0" cy="6" rx="4.6" ry="6"/><ellipse cx="-6" cy="0" rx="6" ry="4.6"/></g>
      <circle r="3.2" fill="#E9A10A"/>
    </symbol>
    <g id="dots" fill="#2B2927" opacity=".55"><circle cx="-6" cy="-3" r="1.6"/><circle cx="4" cy="2" r="1.3"/><circle cx="-1" cy="6" r="1.1"/><circle cx="7" cy="-5" r="1"/></g>
  </defs>
  <!-- 먼 오름 -->
  <path d="M0 124 C110 96 210 100 320 114 C420 128 480 106 570 98 C660 90 760 110 860 106 C940 102 990 94 1024 98 V200 H0Z" fill="url(#far)"/>
  <!-- 한라산 -->
  <path d="M420 152 C496 122 552 86 604 70 C620 65 628 59 640 57 L682 57 C694 59 702 65 718 70 C772 86 826 122 910 152 Z" fill="url(#halla)"/>
  <path d="M604 70 C620 65 628 59 640 57 L682 57 C694 59 702 65 718 70 C706 77 694 72 684 80 C674 72 664 83 653 76 C642 84 632 74 620 80 C614 76 609 74 604 70Z" fill="#F7F8F2"/>
  <!-- 가까운 오름 -->
  <path d="M0 162 C110 134 214 138 304 152 C394 166 474 148 566 152 C664 156 764 138 862 148 C942 156 992 152 1024 148 V200 H0Z" fill="url(#near)"/>
  <path d="M0 184 C140 168 282 172 424 182 C564 192 704 178 844 180 C934 182 992 178 1024 176 V200 H0Z" fill="#6E8C5A" opacity=".55"/>
  <!-- 왼쪽 유채꽃 -->
  <g fill="none" stroke="#6F9443" stroke-width="3.2" stroke-linecap="round">
    <path d="M30 200 C31 180 34 160 30 132"/><path d="M58 200 C57 182 60 166 64 150"/><path d="M86 200 C84 186 82 172 90 160"/><path d="M14 200 C16 188 18 176 12 166"/><path d="M112 200 C112 190 114 182 118 174"/>
  </g>
  <g fill="#82A954"><ellipse cx="40" cy="178" rx="9" ry="3.6" transform="rotate(-35 40 178)"/><ellipse cx="22" cy="186" rx="8" ry="3.2" transform="rotate(30 22 186)"/><ellipse cx="72" cy="182" rx="9" ry="3.6" transform="rotate(-28 72 182)"/></g>
  <use href="#fl" x="16" y="114" width="28" height="28"/><use href="#fl" x="34" y="126" width="22" height="22"/><use href="#fl" x="8" y="132" width="20" height="20"/>
  <use href="#fl" x="50" y="134" width="26" height="26"/><use href="#fl" x="66" y="146" width="20" height="20"/>
  <use href="#fl" x="78" y="142" width="24" height="24"/><use href="#fl" x="0" y="152" width="22" height="22"/><use href="#fl" x="92" y="158" width="18" height="18"/><use href="#fl" x="106" y="164" width="20" height="20"/>
  <!-- 오른쪽 현무암 돌담 -->
  <g>
    <ellipse cx="884" cy="190" rx="26" ry="17" fill="url(#rock)"/><ellipse cx="934" cy="188" rx="28" ry="19" fill="url(#rock)"/><ellipse cx="986" cy="186" rx="30" ry="20" fill="url(#rock)"/><ellipse cx="1024" cy="184" rx="20" ry="19" fill="url(#rock)"/>
    <ellipse cx="908" cy="164" rx="24" ry="16" fill="url(#rock)"/><ellipse cx="958" cy="160" rx="27" ry="18" fill="url(#rock)"/><ellipse cx="1008" cy="157" rx="26" ry="18" fill="url(#rock)"/>
    <ellipse cx="934" cy="137" rx="22" ry="14" fill="url(#rock)"/><ellipse cx="982" cy="133" rx="25" ry="16" fill="url(#rock)"/><ellipse cx="1022" cy="131" rx="18" ry="14" fill="url(#rock)"/>
    <use href="#dots" transform="translate(884 190)"/><use href="#dots" transform="translate(936 187)"/><use href="#dots" transform="translate(988 186)"/>
    <use href="#dots" transform="translate(908 164)"/><use href="#dots" transform="translate(960 160)"/><use href="#dots" transform="translate(1008 157)"/>
    <use href="#dots" transform="translate(934 137)"/><use href="#dots" transform="translate(982 133)"/>
  </g>
</svg>
