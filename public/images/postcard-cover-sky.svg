<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 614 377">
  <!-- 로고 엽서 그림: 맑은 하늘색 하늘, 왼쪽 아래·오른쪽에 뭉게구름 (사용자가 준 시안을 본떠 그림) -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8CCAF4"/>
      <stop offset=".62" stop-color="#B2DCF8"/>
      <stop offset="1" stop-color="#D2EAFB"/>
    </linearGradient>
    <!-- 구름 한 덩이: 왼쪽 위가 밝고 가장자리는 옅은 회청색 -->
    <radialGradient id="puff" cx=".4" cy=".34" r=".66">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".55" stop-color="#FCFAF5"/>
      <stop offset=".85" stop-color="#EDF1F3"/>
      <stop offset="1" stop-color="#D5E3EE"/>
    </radialGradient>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="1.3"/></filter>
    <filter id="haze" x="-30%" y="-100%" width="160%" height="300%"><feGaussianBlur stdDeviation="9"/></filter>
  </defs>
  <rect width="614" height="377" fill="url(#sky)"/>
  <!-- 높은 하늘의 옅은 새털구름 -->
  <g filter="url(#haze)" fill="#FFFFFF" opacity=".38">
    <ellipse cx="150" cy="58" rx="96" ry="9"/>
    <ellipse cx="470" cy="44" rx="74" ry="7"/>
    <ellipse cx="300" cy="352" rx="150" ry="18"/>
  </g>
  <!-- 왼쪽 아래 구름 -->
  <g filter="url(#soft)" fill="url(#puff)">
    <circle cx="8" cy="262" r="40"/>
    <circle cx="52" cy="238" r="38"/>
    <circle cx="98" cy="258" r="34"/>
    <circle cx="20" cy="312" r="56"/>
    <circle cx="86" cy="300" r="48"/>
    <circle cx="140" cy="318" r="40"/>
    <circle cx="184" cy="344" r="34"/>
    <circle cx="40" cy="368" r="52"/>
    <circle cx="112" cy="370" r="48"/>
    <circle cx="176" cy="382" r="40"/>
  </g>
  <!-- 오른쪽 구름: 위로 높이 솟은 뭉게구름 -->
  <g filter="url(#soft)" fill="url(#puff)">
    <circle cx="566" cy="132" r="44"/>
    <circle cx="526" cy="164" r="38"/>
    <circle cx="606" cy="160" r="46"/>
    <circle cx="496" cy="212" r="40"/>
    <circle cx="552" cy="206" r="52"/>
    <circle cx="612" cy="222" r="48"/>
    <circle cx="462" cy="262" r="40"/>
    <circle cx="520" cy="268" r="56"/>
    <circle cx="598" cy="282" r="56"/>
    <circle cx="430" cy="318" r="38"/>
    <circle cx="488" cy="330" r="50"/>
    <circle cx="560" cy="338" r="56"/>
    <circle cx="616" cy="346" r="48"/>
    <circle cx="410" cy="366" r="34"/>
    <circle cx="470" cy="384" r="44"/>
  </g>
</svg>
