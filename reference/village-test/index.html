/* Layout: one phone-width column over a Jeju sky; every block is a torn-paper card, the hareubang talks at the bottom of each step. */
:root {
  --sky-top: #2E93D1;
  --sky-mid: #6FB4E6;
  --sky-low: #CFE3F3;
  --blue: #4085E0;
  --deep: #2668B9;
  --orange: #FD7925;
  --yellow: #FFD43B;
  --paper: #FFFFFF;
  --muted: #5B7FAE;
  --line: rgba(38, 104, 185, .22);
  --shadow: rgba(6, 42, 85, .28);
  --f-display: 'Bagel Fat One', 'Jua', 'Apple SD Gothic Neo', sans-serif;
  --f-body: 'Gmarket', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  --f-hand: 'Nanum Pen Script', 'Jua', cursive;
  --f-talk: 'Jua', 'Apple SD Gothic Neo', sans-serif;
  color-scheme: light;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--sky-low) linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 40%, var(--sky-low) 100%) fixed;
  color: var(--deep); font-family: var(--f-body); -webkit-font-smoothing: antialiased;
  word-break: keep-all; overflow-wrap: break-word;
}
body::after {   /* film grain */
  content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 50; opacity: .5; mix-blend-mode: soft-light;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}
/* start-screen photo: soft blur + white haze, same treatment as the card news cover */
.bgphoto { position: fixed; inset: 0; z-index: -1; background: var(--sky-mid) url("img/bg.jpg") 50% 30% / cover no-repeat; filter: blur(3.5px); transform: scale(1.04); }
.bgphoto::after { content: ''; position: absolute; inset: 0; background: rgba(255, 255, 255, .24); }
.app {
  position: relative; max-width: 460px; margin: 0 auto; min-height: 100%;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 14px 40px; display: flex; flex-direction: column;
}
.screen { display: flex; flex-direction: column; gap: 18px; flex: 1; }
.app.fit { height: 100%; min-height: 0; container-type: size; overflow-y: auto; padding-block: 10px 12px; }
.app.fit .screen { flex: 1; min-height: 0; gap: clamp(8px, 1.7cqh, 18px); }
.app.fit .hdr { min-height: 0; margin-bottom: clamp(4px, 1cqh, 10px); }
.app.fit .pill { padding-block: clamp(6px, 1cqh, 9px) clamp(4px, .8cqh, 7px); }
.app.fit .topbar { min-height: 0; }
.app.fit .logo { width: clamp(36px, 6cqh, 52px); }
.app.fit .talk { margin-top: auto; padding-top: 0; }
#quiz .talk { margin-top: 0; }
.app.fit .talk img { width: auto; height: clamp(68px, 15cqh, 160px); }
.app.fit .bubble { font-size: clamp(14px, 2.2cqh, 19px); margin-bottom: clamp(18px, 4cqh, 38px); padding: clamp(9px, 1.4cqh, 13px) clamp(13px, 2cqh, 18px) clamp(7px, 1.1cqh, 10px); }
.topbar { display: flex; align-items: center; justify-content: space-between; min-height: 52px; }
.hdr { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 52px; margin-bottom: 10px; }
.logo-btn { border: 0; background: none; padding: 0; cursor: pointer; display: block; }
.hdr-actions { display: flex; gap: 8px; }
.pill { display: inline-flex; align-items: center; gap: 6px; border: 0; cursor: pointer; background: rgba(255,255,255,.93); color: var(--deep);
  border-radius: 999px; padding: 9px 14px 7px 11px; font: 700 14px/1 var(--f-body); letter-spacing: -0.01em; box-shadow: 0 3px 8px rgba(0, 40, 90, .18); }
.pill svg { width: 19px; height: 19px; flex: none; }
.pill.on { background: var(--orange); color: #fff; }
.logo { width: 52px; height: auto; display: block; filter: drop-shadow(0 1px 2px rgba(0,0,0,.15)); }
button { font: inherit; color: inherit; }
button:focus-visible, a:focus-visible { outline: 3px solid var(--yellow); outline-offset: 3px; border-radius: 12px; }

/* torn paper */
.paper { position: relative; padding: 22px 20px; }
.paper > .pshadow { position: absolute; inset: 0; filter: drop-shadow(0 6px 8px var(--shadow)); pointer-events: none; }
.paper > .pshadow > .pbg {
  position: absolute; inset: 0; background-color: var(--paper);
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='p'><feTurbulence type='fractalNoise' baseFrequency='.018' numOctaves='3' seed='4'/><feColorMatrix values='0 0 0 0 .55  0 0 0 0 .62  0 0 0 0 .72  0 0 0 .16 0'/></filter><rect width='100%' height='100%' filter='url(%23p)'/></svg>");
}
.paper > :not(.pshadow) { position: relative; }

/* chips + icons */
.icon { width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 3.6; stroke-linecap: round; stroke-linejoin: round; }
.chip { display: inline-flex; align-items: center; justify-content: center; border-radius: 50%; flex: none; color: #fff; background: var(--blue); }
.chip > svg { width: 60%; height: 60%; }
.chip.o { background: var(--orange); }

/* talking hareubang */
.talk { display: flex; align-items: flex-end; gap: 10px; margin-top: auto; padding-top: 6px; }
.talk img { width: 112px; height: auto; flex: none; filter: drop-shadow(0 6px 8px rgba(0, 30, 60, .3)); }
.bubble {
  position: relative; background: #fff; border-radius: 22px; padding: 13px 18px 10px; margin-bottom: 38px;
  font: 400 19px/1.35 var(--f-talk); color: var(--deep); box-shadow: 0 5px 12px rgba(0, 40, 90, .2); text-wrap: balance;
}
.bubble::before { content: ''; position: absolute; left: -14px; bottom: 16px; border-style: solid; border-width: 9px 18px 9px 0; border-color: transparent #fff transparent transparent; }

/* buttons */
.cta {
  display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; min-height: 60px; border: 0; border-radius: 999px;
  background: var(--orange); color: #fff; font: 700 20px/1 var(--f-body); letter-spacing: -0.02em; cursor: pointer;
  box-shadow: 0 6px 0 #C9561A, 0 10px 18px rgba(0, 40, 90, .25); transition: transform .12s, box-shadow .12s; text-decoration: none;
}
.cta:active { transform: translateY(4px); box-shadow: 0 2px 0 #C9561A, 0 6px 12px rgba(0, 40, 90, .25); }
.cta.blue { background: var(--blue); box-shadow: 0 6px 0 #2B66B5, 0 10px 18px rgba(0, 40, 90, .25); }
.cta.ghost { background: #fff; color: var(--deep); box-shadow: 0 6px 0 #B9CFE8, 0 10px 18px rgba(0, 40, 90, .18); }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.back { border: 0; background: rgba(255,255,255,.9); color: var(--deep); border-radius: 999px; padding: 10px 14px 8px; font: 700 14px var(--f-body); cursor: pointer; }

/* ---------- start ---------- */
#start .hero { display: flex; flex-direction: column; align-items: center; text-align: center; gap: clamp(6px, 1.4cqh, 12px); padding-top: 0; }
#start .kicker { font: 700 clamp(13px, 1.9cqh, 15px) var(--f-body); color: #fff; letter-spacing: .02em; background: rgba(38, 104, 185, .55); padding: 8px 14px 6px; border-radius: 999px; }
#start .title { width: min(100%, 380px); height: clamp(96px, 27cqh, 210px); object-fit: contain; display: block; }
#start .sub { margin: 0; font: 400 clamp(21px, 3.4cqh, 30px)/1.15 var(--f-hand); color: #fff; text-shadow: 0 2px 6px rgba(10, 60, 120, .55); }
#start .meta { margin: 0; text-align: center; font: 700 14px var(--f-body); color: #fff; text-shadow: 0 1px 4px rgba(0, 40, 90, .6); }
#start .talk { margin-top: clamp(4px, 1.5cqh, 16px); justify-content: center; }
#start .talk img { height: clamp(84px, 21cqh, 200px); }
.app.fit .cta { min-height: clamp(48px, 7cqh, 60px); font-size: clamp(17px, 2.5cqh, 20px); }

/* ---------- question ---------- */
.progress { display: flex; gap: 8px; align-items: center; }
.progress .chip { width: 34px; height: 34px; background: rgba(255,255,255,.9); color: var(--blue); transition: all .2s; }
.progress .chip.done { background: var(--blue); color: #fff; }
.progress .chip.on { width: 44px; height: 44px; background: var(--orange); color: #fff; box-shadow: 0 3px 8px rgba(0, 40, 90, .25); }
.qcard { display: flex; flex-direction: column; gap: clamp(4px, 1cqh, 10px); }
.app.fit .qcard { padding: clamp(12px, 2.3cqh, 22px) 20px; }
.qno { font: 400 clamp(30px, 5.4cqh, 46px)/1 var(--f-display); color: var(--orange); }
.qtext { font: 400 clamp(20px, 3.3cqh, 27px)/1.25 var(--f-display); color: var(--deep); letter-spacing: -0.01em; text-wrap: balance; }
.opts { display: flex; flex-direction: column; gap: clamp(6px, 1.1cqh, 10px); }
.app.fit .opt { min-height: clamp(40px, 6.4cqh, 56px); padding: clamp(7px, 1.3cqh, 15px) 16px clamp(5px, 1.1cqh, 13px); font-size: clamp(14.5px, 2.1cqh, 17px); }
.app.fit .opt .box { width: clamp(20px, 2.8cqh, 24px); height: clamp(20px, 2.8cqh, 24px); }
.opt {
  display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; border: 0; cursor: pointer;
  background: #fff; border-radius: 16px; padding: 15px 16px 13px; min-height: 56px;
  font: 500 17px/1.3 var(--f-body); color: var(--deep); letter-spacing: -0.02em;
  box-shadow: 0 3px 0 #B9CFE8, 0 6px 14px rgba(0, 40, 90, .14); transition: transform .1s, background .15s, color .15s;
}

/* ===================== scoring ===================== */
// answers: array of option indexes, one per question
function score(answers) {
  const total = Object.fromEntries(ORDER.map(k => [k, 0]));
  const byQ = QUESTIONS.map(() => Object.fromEntries(ORDER.map(k => [k, 0])));
  answers.forEach((ai, qi) => {
    const q = QUESTIONS[qi], pts = q.opts[ai][2], w = q.weight || 1;
    for (const [k, v] of Object.entries(pts)) { total[k] += v * w; byQ[qi][k] += v; }
  });
  // ties: the 'daily life' answer first, then mobility, then companions, then map order
  const rank = ORDER.slice().sort((a, b) =>
    total[b] - total[a] || byQ[4][b] - byQ[4][a] || byQ[2][b] - byQ[2][a] || byQ[1][b] - byQ[1][a] || ORDER.indexOf(a) - ORDER.indexOf(b));
  return { rank, total };
}

/* ===================== torn paper ===================== */
function tear(el) {
  const bg = el.querySelector('.pbg'); if (!bg) return;
  const w = el.offsetWidth, h = el.offsetHeight; if (!w || !h) return;
  let seed = [...(el.dataset.seed || 'x')].reduce((s, c) => s + c.charCodeAt(0), 7);
  const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
  const pts = [], step = 13, J = 5;
  const edge = (x0, y0, x1, y1, ix, iy) => {
    const n = Math.max(2, Math.round(Math.hypot(x1 - x0, y1 - y0) / step));
    for (let i = 0; i < n; i++) {
      const t = i / n, j = rnd() * J + (rnd() < .07 ? rnd() * 5 : 0);
      pts.push(`${(x0 + (x1 - x0) * t + ix * j).toFixed(1)}px ${(y0 + (y1 - y0) * t + iy * j).toFixed(1)}px`);
    }
  };
  edge(0, 0, w, 0, 0, 1); edge(w, 0, w, h, -1, 0); edge(w, h, 0, h, 0, -1); edge(0, h, 0, 0, 1, 0);
  bg.style.clipPath = `polygon(${pts.join(',')})`;
}
const paperRO = new ResizeObserver(es => es.forEach(e => tear(e.target)));
function papers(root) {
  root.querySelectorAll('.paper').forEach(p => {
    if (!p.querySelector(':scope > .pshadow')) p.insertAdjacentHTML('afterbegin', '<div class="pshadow"><div class="pbg"></div></div>');
    tear(p); paperRO.observe(p);
  });
}

    })()}
    <button class="cta yellow combo" type="button" data-act="share"><span class="l1"><svg viewBox="0 0 48 48" aria-hidden="true"><use href="#i-share"/></svg><span>친구에게 공유하기</span></span></button>

}

// Keep the answer chips on one line: shrink the text down to 11px; if that is still too wide, break 3/2.
function fitChips() {
  const box = document.querySelector('#result .answers'); if (!box) return;
  box.classList.remove('two');
  for (let fs = 13; fs >= 11; fs -= 0.5) {
    box.style.setProperty('--chip-fs', fs + 'px');
    if (box.scrollWidth <= box.clientWidth + 1) return;
  }
  box.style.setProperty('--chip-fs', '13px');
  box.classList.add('two');
}
window.addEventListener('resize', () => { if (!$('result').hidden) fitChips(); });

// Clipboard copy must start inside the click handler; if the frame refuses it, show the text to copy by hand.
function copyText(text, okMsg, done = () => {}) {
  const fallback = () => { $('copytext').value = text; $('copybox').hidden = false; setTimeout(() => $('copytext').select(), 50); done('copy_box'); };
  try {
    navigator.clipboard.writeText(text).then(() => { toast(okMsg); done('copy'); }, fallback);
  } catch (e) { fallback(); }
}
function shareTest() {
  const onResult = !$('result').hidden && mine;
  const r = onResult ? RESULTS[mine.rank[0]] : null;
  const msg = r
    ? `나는 ‘${r.region}’(${r.type}) 나왔어! 너는 제주 어디 주민일까?\n질문 5개로 찾는 제주 한 달 살기 동네 테스트`
    : '나는 제주 어디 주민? 질문 5개로 찾는 제주 한 달 살기 동네 테스트';
  const text = `${msg} 👉 ${SHARE_URL}`;
  const copied = '공유 문구를 복사했어요! 카톡이나 DM에 붙여넣어 친구에게 보내 주세요.';
  const touch = (navigator.maxTouchPoints || 0) > 0 || (window.matchMedia && matchMedia('(pointer: coarse)').matches);   // PC: copying the link beats the Windows share dialog
  // counted only once it went through (an app was picked, or the text was copied); closing the share sheet is not a share
  const sent = method => track('share', { method, screen: ['start', 'quiz', 'result'].find(s => !$(s).hidden) || 'other' });
  if (STANDALONE && navigator.share && !IN_APP && touch) {   // the phone's own share sheet (KakaoTalk, Instagram DM, messages…)
    navigator.share({ title: '나는 제주 어디 주민?', text: msg, url: SHARE_URL })
      .then(() => sent('share_sheet'), e => { if (!e || e.name !== 'AbortError') copyText(text, copied, sent); });
    return;
  }
  copyText(text, copied, sent);
}

/* ===================== result image ===================== */
// Inside claude.ai the viewer's own save prompt handles the file; anywhere else we show the image to long-press.
let downloads = null;
const downloadsReady = (async () => {
  try { downloads = await window.claude?.use?.('downloads') ?? null; } catch (e) { downloads = null; }
})();
const waitDownloads = () => Promise.race([downloadsReady, new Promise(r => setTimeout(r, 1500))]);

let toastTimer;
function toast(msg, ms = 2600) {
  const t = $('toast'); t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, ms);
}
function placeName(key) { return RESULTS[key].region.replace(' 주민', ''); }   // hoisted: renderResult may run before this line
// After the image is saved: go on to the neighbourhood's spots page in the webzine (when it exists).
// wait: only as long as the save needs (0 after the iPhone share sheet; a moment after a download starts,
// because leaving the page too early cancels a download that has not begun).
function afterSaved(key, wait = 0) {
  const url = PLACE_PAGES[key];
  if (!url) { toast(WEBZINE_SOON, 4200); return; }
  if (STANDALONE) { toast(`‘${placeName(key)}’ 대표 명소 페이지로 이동할게요!`); setTimeout(() => location.assign(url), wait); }
  else toast(`이미지를 저장했어요! ‘${placeName(key)}’ 대표 명소는 이제주민 웹진에서 볼 수 있어요.`, 4200);
}
let pendingKey = null;
const toDataURL = blob => new Promise((ok, bad) => { const f = new FileReader(); f.onload = () => ok(f.result); f.onerror = bad; f.readAsDataURL(blob); });
function closeSheet() {
  $('sheet').hidden = true;
  pendingKey = null;   // × just closes; only the orange button moves on
}
function sheetGo() {
  const k = pendingKey;
  closeSheet();
  if (k) afterSaved(k);
}
function showCapture(dataUrl, key) {
  pendingKey = key || null;
  if (key) saved(key, 'capture_screen');   // in-app browsers: the image is shown to screenshot
  $('sheetnext').textContent = key ? `${placeName(key)} 대표 명소 보러가기 →` : '닫기';
  $('sheetimg').src = dataUrl; $('sheet').hidden = false;
}
async function showCaptureOf(blob, key) { showCapture(await toDataURL(blob), key); }

// In-app browsers (KakaoTalk, Instagram, Facebook, Naver, Line…) block saving files, so they get the capture screen.
const IN_APP = /KAKAOTALK|Instagram|FBAN|FBAV|FB_IAB|NAVER\(inapp|Line\/|DaumApps|everytimeApp|BAND\//i.test(navigator.userAgent || '');
const IS_IOS = /iPad|iPhone|iPod/.test(navigator.userAgent || '') || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const imgCache = {};
function prepareImage(key) {
  if (!imgCache[key]) {
    const c = { blob: null };
    // keep a data: URL too: unlike a blob: URL it survives leaving the page, so the download is not cancelled
    c.promise = drawResultImage(key).then(async b => { c.blob = b; c.dataUrl = await toDataURL(b); return b; });
    c.promise.catch(() => { delete imgCache[key]; });
    imgCache[key] = c;
  }
  return imgCache[key];
}
// Standalone site: iPhone -> share sheet ('이미지 저장' puts it in Photos); Android / PC -> ordinary download.
function nativeSave(blob, name, key) {
  let file = null;
  try { file = new File([blob], name, { type: 'image/png' }); } catch (e) { /* very old browsers */ }
  if (IS_IOS && file && navigator.canShare && navigator.canShare({ files: [file] })) {
    navigator.share({ files: [file] }).then(() => { saved(key, 'ios_share'); afterSaved(key); }, e => {
      if (e && e.name === 'AbortError') afterSaved(key);   // closed the share sheet without saving: still go on
      else showCaptureOf(blob, key);
    });
    return;
  }
  const c = imgCache[key], data = c && c.dataUrl;
  const url = data || URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  saved(key, 'download');
  if (!data) setTimeout(() => URL.revokeObjectURL(url), 5000);
  afterSaved(key, data ? 400 : 1200);
}

// Save straight away where the viewer can; where saving is blocked (e.g. inside KakaoTalk or Instagram),
// show the image alone on screen so it can be captured.
async function saveImage(btn) {
  const key = btn.dataset.key, label = btn.querySelector('.lbl') || btn.querySelector('span'), old = label.textContent;
  const name = `나는제주어디주민_${RESULTS[key].region.replace(/[\s·]/g, '')}.png`;
  const c = prepareImage(key);
  if (STANDALONE) {
    if (c.blob) { if (IN_APP) showCaptureOf(c.blob, key); else nativeSave(c.blob, name, key); return; }   // no await: keeps the tap's permission
    btn.disabled = true; label.textContent = '이미지 만드는 중…';
    try { const blob = await c.promise; if (IN_APP) showCaptureOf(blob, key); else nativeSave(blob, name, key); }
    catch (e) { toast('이미지를 만들지 못했어요. 다시 한 번 눌러 주세요.'); }
    finally { btn.disabled = false; label.textContent = old; }
    return;
  }
  btn.disabled = true; label.textContent = '이미지 만드는 중…';
  try {
    const [blob] = await Promise.all([c.promise, waitDownloads()]);
    if (downloads) {
      try {
        const res = await downloads.save({ filename: name, data: blob });
        if (res && res.status === 'saved') { afterSaved(key); return; }
      } catch (e) {
        const code = e && e.code;
        if (code === 'declined') return;
        if (code === 'rate_limited') { toast('저장 창이 이미 열려 있어요. 잠시 후 다시 눌러 주세요.'); return; }
      }
    }
    showCapture(await toDataURL(blob), key);
  } catch (e) {
    toast('이미지를 만들지 못했어요. 다시 한 번 눌러 주세요.');
  } finally { btn.disabled = false; label.textContent = old; }
}

const loadImg = src => new Promise((ok, bad) => { const i = new Image(); i.onload = () => ok(i); i.onerror = bad; i.src = src; });
function rr(g, x, y, w, h, r) {
  g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}
function torn(g, x, y, w, h, seedStr) {
  let seed = [...seedStr].reduce((a, c) => a + c.charCodeAt(0), 11);
  const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
  const pts = [];
  const edge = (x0, y0, x1, y1, ix, iy) => {
    const n = Math.max(2, Math.round(Math.hypot(x1 - x0, y1 - y0) / 16));
    for (let i = 0; i < n; i++) {
      const t = i / n, j = rnd() * 8 + (rnd() < .07 ? rnd() * 8 : 0);
      pts.push([x0 + (x1 - x0) * t + ix * j, y0 + (y1 - y0) * t + iy * j]);
    }
  };
  edge(x, y, x + w, y, 0, 1); edge(x + w, y, x + w, y + h, -1, 0); edge(x + w, y + h, x, y + h, 0, -1); edge(x, y + h, x, y, 1, 0);
  g.beginPath(); pts.forEach(([px, py], i) => i ? g.lineTo(px, py) : g.moveTo(px, py)); g.closePath();
}
// shrink the font until the text fits maxW, then draw it
function fit(g, text, x, y, maxW, size, pattern) {
  let s = size; g.font = pattern.replace('{s}', s);
  while (g.measureText(text).width > maxW && s > 12) { s -= 2; g.font = pattern.replace('{s}', s); }
  g.fillText(text, x, y);
}
function wrapWords(g, text, maxW) {
  const lines = []; let line = '';
  for (const w of text.split(' ')) {
    const t = line ? line + ' ' + w : w;
    if (g.measureText(t).width <= maxW || !line) line = t; else { lines.push(line); line = w; }
  }
  if (line) lines.push(line);
  return lines;
}

async function drawResultImage(key) {
  const r = RESULTS[key];
  await Promise.all(['400 60px "Bagel Fat One"', '400 40px "Jua"', '400 50px "Nanum Pen Script"', '500 30px "Gmarket"', '700 30px "Gmarket"']
    .map(f => document.fonts.load(f, '가나다라 ABC').catch(() => null)));
  const [logo, pose] = await Promise.all([loadImg('img/logo.webp'), loadImg(`img/${r.pose}.webp`)]);
  const W = 1080, H = 1350, c = document.createElement('canvas'); c.width = W; c.height = H;
  const g = c.getContext('2d');
  const DISP = '"Bagel Fat One", "Jua", sans-serif', BODY = '"Gmarket", "Apple SD Gothic Neo", sans-serif';

  // sky, corner, logo, title
  const sky = g.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, '#2E93D1'); sky.addColorStop(.42, '#6FB4E6'); sky.addColorStop(1, '#CFE3F3');
  g.fillStyle = sky; g.fillRect(0, 0, W, H);
  g.fillStyle = 'rgba(255,255,255,.3)'; g.beginPath(); g.moveTo(0, 0); g.lineTo(330, 0); g.lineTo(0, 330); g.fill();
  g.drawImage(logo, 34, 30, 96, 96 * logo.height / logo.width);
  g.textAlign = 'center'; g.textBaseline = 'alphabetic';
  g.font = `400 50px ${DISP}`;
  g.fillStyle = 'rgba(38,104,185,.55)'; g.fillText('나는 제주 어디 주민?', W / 2 + 40, 122);
  g.fillStyle = '#fff'; g.fillText('나는 제주 어디 주민?', W / 2 + 40, 118);

  // torn paper card
  const CX = 64, CY = 170, CW = W - 128, CH = 1095;
  g.save(); g.shadowColor = 'rgba(6,42,85,.3)'; g.shadowBlur = 26; g.shadowOffsetY = 10;
  torn(g, CX, CY, CW, CH, key); g.fillStyle = '#fff'; g.fill(); g.restore();

  // type pill, region, area, one-liner
  g.font = `700 32px ${BODY}`;
  const pw = g.measureText(r.type).width + 64;
  rr(g, W / 2 - pw / 2, 226, pw, 60, 30); g.fillStyle = '#4085E0'; g.fill();
  g.fillStyle = '#fff'; g.fillText(r.type, W / 2, 268);
  g.fillStyle = '#FD7925'; fit(g, r.region, W / 2, 392, 860, 96, `400 {s}px ${DISP}`);
  g.fillStyle = '#5B7FAE'; g.font = `700 28px ${BODY}`; g.fillText(r.area, W / 2, 442);
  g.fillStyle = '#2668B9'; fit(g, `“${r.line}”`, W / 2, 512, 860, 52, '400 {s}px "Nanum Pen Script", cursive');

  // hareubang + bubble
  const ph = 220, pw2 = pose.width * ph / pose.height, hx = 160, hy = 546;
  g.drawImage(pose, hx, hy, pw2, ph);
  g.font = '400 36px "Jua", sans-serif';
  const tl = wrapWords(g, r.talk.replace(/<br>/g, ' '), 470), lh = 48;
  const bw = Math.max(...tl.map(l => g.measureText(l).width)) + 64, bh = tl.length * lh + 40;
  const bx = hx + pw2 + 34, by = hy + ph * .42 - bh / 2;
  rr(g, bx, by, bw, bh, 30); g.fillStyle = '#EEF5FD'; g.fill();
  g.beginPath(); g.moveTo(bx - 22, by + bh / 2); g.lineTo(bx + 2, by + bh / 2 - 13); g.lineTo(bx + 2, by + bh / 2 + 13); g.closePath(); g.fill();
  g.fillStyle = '#2668B9'; g.textAlign = 'left';
  tl.forEach((l, i) => g.fillText(l, bx + 32, by + 20 + lh * (i + 1) - 12));

  // two columns: meters + keywords
  const head = (t, x, y) => {
    g.fillStyle = '#FD7925'; g.beginPath(); g.arc(x + 8, y - 10, 8, 0, Math.PI * 2); g.fill();
    g.fillStyle = '#2668B9'; g.font = `700 30px ${BODY}`; g.fillText(t, x + 26, y);
  };
  const HEAD_Y = 822, ROW_Y = 876, ROW = 48;
  head('하르방 체감 지수', 124, HEAD_Y);
  STAT_LABELS.forEach((l, i) => {
    const y = ROW_Y + i * ROW;
    g.fillStyle = '#5B7FAE'; g.font = `500 27px ${BODY}`; g.fillText(l, 124, y);
    for (let n = 0; n < 5; n++) {
      g.beginPath(); g.arc(288 + n * 38, y - 9, 14, 0, Math.PI * 2);
      g.fillStyle = n < r.stats[i] ? '#FD7925' : '#E3ECF7'; g.fill();
    }
  });
  head('이런 당신에게 딱', 520, HEAD_Y);
  r.kw.forEach((k, i) => {
    const y = ROW_Y + i * ROW;
    g.strokeStyle = '#FD7925'; g.lineWidth = 4; g.lineCap = 'round'; g.lineJoin = 'round';
    g.beginPath(); g.moveTo(522, y - 12); g.lineTo(530, y - 4); g.lineTo(545, y - 22); g.stroke();
    g.fillStyle = '#2668B9'; fit(g, k, 558, y, 400, 27, `500 {s}px ${BODY}`);
  });

  // tip box, with the <b> parts in orange
  const runs = [{ t: '현실 팁 · ', b: true }].concat(
    r.tip.split(/(<b>.*?<\/b>)/).filter(Boolean).map(t => ({ t: t.replace(/<\/?b>/g, ''), b: /^<b>/.test(t) })));
  const TX = 128, TW = W - 256, TS = 27, TL = 40;
  const words = [];
  runs.forEach(rn => rn.t.split(/(\s+)/).filter(Boolean).forEach(w => words.push({ w, b: rn.b })));
  const lines = [[]]; let lw = 0;
  words.forEach(o => {
    g.font = `${o.b ? 700 : 500} ${TS}px ${BODY}`;
    const w = g.measureText(o.w).width, cur = lines[lines.length - 1];
    if (lw + w > TW - 44 && cur.length && o.w.trim()) { lines.push([]); lw = 0; }
    if (!lines[lines.length - 1].length && !o.w.trim()) return;
    lines[lines.length - 1].push({ ...o, width: w }); lw += w;
  });
  const tipH = lines.length * TL + 34, tipY = ROW_Y + 4 * ROW + 40;
  rr(g, TX, tipY, TW, tipH, 20); g.fillStyle = '#FFF5CC'; g.fill();
  lines.forEach((ln, i) => {
    let x = TX + 22;
    ln.forEach(o => {
      g.font = `${o.b ? 700 : 500} ${TS}px ${BODY}`; g.fillStyle = o.b ? '#FD7925' : '#5A4A10';
      g.fillText(o.w, x, tipY + 17 + TL * (i + 1) - 10); x += o.width;
    });
  });

  g.textAlign = 'center'; g.fillStyle = '#2668B9'; g.font = `700 26px ${BODY}`;
  g.fillText('제주 한 달 살기 동네 테스트 · @e_jeju.min', W / 2, H - 34);
  return new Promise((ok, bad) => c.toBlob(b => (b ? ok(b) : bad(new Error('toBlob'))), 'image/png'));
}
